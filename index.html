<!doctype html>
<html>
    <head>
        <!-- Added Interactive UI: viewport meta for mobile responsiveness -->
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <!-- End Added Interactive UI -->

        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

        <!-- Added Interactive UI: billboard component (always face camera) -->
        <script>
            // Added button interactions
            // Simple billboard component so buttons/panels always face the camera.
            // Registered here (before a-scene is parsed) so it is available to entities.
            if (window.AFRAME && !AFRAME.components['billboard']) {
                AFRAME.registerComponent('billboard', {
                    tick: function () {
                        var cameraEl = this.cameraEl || (this.cameraEl = document.querySelector('[camera]'));
                        if (!cameraEl || !cameraEl.object3D) return;
                        var camPos = new THREE.Vector3();
                        cameraEl.object3D.getWorldPosition(camPos);
                        this.el.object3D.lookAt(camPos);
                    }
                });
            }
        </script>
        <!-- End Added Interactive UI -->

        <!-- Model Switch -->
        <script>
            // Model Switching Logic
            // Generic fade component for glTF models. A-Frame's built-in "material"
            // component only works on primitives with their own geometry, so for a
            // gltf-model (which can contain many meshes/materials) we register a small
            // native A-Frame component whose single numeric property ("opacity") can be
            // driven by A-Frame's native <a-animation>/animation__ system. Whenever the
            // component's data changes, it pushes that opacity value onto every material
            // found inside the entity's loaded 3D model, giving a real fade in/out.
            if (window.AFRAME && !AFRAME.components['fade-opacity']) {
                AFRAME.registerComponent('fade-opacity', {
                    schema: { opacity: { type: 'number', default: 1 } },
                    init: function () {
                        var self = this;
                        this.materials = [];
                        this.el.addEventListener('model-loaded', function () {
                            self.collectMaterials();
                            self.applyOpacity();
                        });
                        // In case the model object is already present when this component initializes.
                        if (this.el.getObject3D('mesh')) {
                            this.collectMaterials();
                        }
                    },
                    collectMaterials: function () {
                        this.materials = [];
                        var root = this.el.getObject3D('mesh') || this.el.object3D;
                        if (!root) return;
                        var self = this;
                        root.traverse(function (node) {
                            if (node.isMesh && node.material) {
                                var mats = Array.isArray(node.material) ? node.material : [node.material];
                                mats.forEach(function (mat) {
                                    mat.transparent = true;
                                    mat.depthWrite = true;
                                    self.materials.push(mat);
                                });
                            }
                        });
                    },
                    update: function () {
                        this.applyOpacity();
                    },
                    applyOpacity: function () {
                        var op = this.data.opacity;
                        this.materials.forEach(function (mat) {
                            mat.opacity = op;
                        });
                    }
                });
            }
        </script>
        <!-- End Model Switch -->
    </head>
    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.gltf"
                ></a-asset-item>

                <!-- Model Switch: replacement glTF model asset (Shadow Flame Mantis) -->
                <!-- scene.gltf is loaded exactly as exported; it resolves scene.bin and
                     the assets/textures/ images itself via its own relative paths, so
                     none of those file paths were touched. -->
                <a-asset-item
                    id="mantis-asset"
                    src="assets/scene.gltf"
                ></a-asset-item>
                <!-- End Model Switch -->

                <!-- Added Interactive UI: generate rounded-rect background textures for buttons/panels -->
                <script>
                    // Added button interactions
                    (function () {
                        function roundRectDataURL(w, h, r, fillStyle) {
                            var canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;
                            var ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, w, h);
                            ctx.fillStyle = fillStyle;
                            ctx.beginPath();
                            ctx.moveTo(r, 0);
                            ctx.arcTo(w, 0, w, h, r);
                            ctx.arcTo(w, h, 0, h, r);
                            ctx.arcTo(0, h, 0, 0, r);
                            ctx.arcTo(0, 0, w, 0, r);
                            ctx.closePath();
                            ctx.fill();
                            return canvas.toDataURL();
                        }

                        var btnImg = document.createElement('img');
                        btnImg.id = 'ui-btn-bg';
                        btnImg.crossOrigin = 'anonymous';
                        btnImg.src = roundRectDataURL(512, 160, 40, 'rgba(15,15,20,0.72)');
                        document.currentScript.parentNode.appendChild(btnImg);

                        var panelImg = document.createElement('img');
                        panelImg.id = 'ui-panel-bg';
                        panelImg.crossOrigin = 'anonymous';
                        panelImg.src = roundRectDataURL(768, 700, 48, 'rgba(10,10,16,0.85)');
                        document.currentScript.parentNode.appendChild(panelImg);
                    })();
                </script>
                <!-- End Added Interactive UI -->
            </a-assets>
            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"

                <a-entity
                    id="bowser-model"
                    scale="0.0032741529961277677 0.0032741529961277677 0.0032741529961277677"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                    animation="property: rotation; from: 0 0 0; to: 0 -360 0; dur: 8000; loop: true; easing: linear"
                    fade-opacity="opacity: 1"
                    animation__modelswitchoutscale="property: scale; from: 0.0032741529961277677 0.0032741529961277677 0.0032741529961277677; to: 0 0 0; dur: 950; easing: easeInBack; startEvents: dragonSwitchOut"
                    animation__modelswitchoutfade="property: fade-opacity.opacity; from: 1; to: 0; dur: 900; easing: easeInQuad; startEvents: dragonSwitchOut"
                ></a-entity>
                <!-- Model Switch: attributes above (fade-opacity + animation__modelswitchout*) added to the
                     original dragon so it can smoothly scale down and fade out the first time it is tapped.
                     Nothing about its default appearance, scale, rotation, animation-mixer or gesture-handler
                     has been changed - the new animations only run when the "dragonSwitchOut" event fires.
                     On marker detection only this dragon entity is visible (default visible = true); the
                     mantis entity below starts hidden, satisfying "only the dragon should be visible" on
                     marker detection. -->

                <!-- Model Switch: replacement model (Shadow Flame Mantis), hidden/zero-scale until the first tap.
                     Position, rotation and target scale are set to be IDENTICAL to the dragon's own resting
                     position (0 0 0), resting rotation (0 0 0) and scale value, so the mantis appears in
                     exactly the same place the dragon occupied. -->
                <a-entity
                    id="mantis-model"
                    visible="false"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="0 0 0"
                    animation-mixer="loop: repeat"
                    gltf-model="#mantis-asset"
                    class="clickable"
                    gesture-handler
                    fade-opacity="opacity: 0"
                    animation="property: rotation; from: 0 0 0; to: 0 -360 0; dur: 8000; loop: true; easing: linear"
                    animation__modelswitchinscale="property: scale; from: 0 0 0; to: 0.0032741529961277677 0.0032741529961277677 0.0032741529961277677; dur: 1000; easing: easeOutBack; startEvents: dragonSwitchIn"
                    animation__modelswitchinfade="property: fade-opacity.opacity; from: 0; to: 1; dur: 1000; easing: easeOutQuad; startEvents: dragonSwitchIn"
                ></a-entity>

                <!-- Model Switch: magical transformation flash / particle burst, played once at the

                        radius-inner="0.02"
                        radius-outer="0.05"

                        radius="0.06"

                        animation__scale="property: scale; from: 0.3 0.3 0.3; to: 3.2 3.2 3.2; dur: 500; easing: easeOutQuad; startEvents: transformFlash"

                        animation__spark1fade="property: material.opacity; from: 0.8; to: 0; dur: 700; easing: easeInQuad; startEvents: transformFlash"
                    ></a-entity>
                    <a-entity
                        geometry="primitive: circle; radius: 0.03; segments: 6"
                        material="shader: flat; color: #FFD87A; transparent: true; opacity: 0.8; side: double"
                        position="-0.05 -0.04 0.02"
                        animation__spark2="property: position; from: -0.05 -0.04 0.02; to: -0.42 -0.3 -0.2; dur: 700; easing: easeOutQuad; startEvents: transformFlash"

        <!-- Added Interactive UI: interaction wiring -->
        <script>
            // Added button interactions
            (function () {
                var sceneEl = document.querySelector('#scene');
                var markerEl = document.querySelector('#animated-marker');
                var buttonsContainer = document.querySelector('#ui-buttons-container');
                var activePanel = null; // currently visible panel name ('about' | 'gallery' | 'contact' | null)

                // Fire Breath Interaction
                var fireBreathEl = document.querySelector('#fire-breath');
                var fireBreathTimer = null;

                function resetFireBreath() {
                    if (!fireBreathEl) return;
                    fireBreathEl.setAttribute('visible', false);
                    fireBreathEl.setAttribute('position', '0 20 60');
                    fireBreathEl.setAttribute('scale', '10 10 10');
                    fireBreathEl.querySelectorAll('[data-fire-layer]').forEach(function (layerEl) {
                        var material = layerEl.getAttribute('material') || {};
                        var opacity = layerEl.getAttribute('data-fire-opacity') || material.opacity;
                        if (opacity !== undefined && opacity !== null) {
                            layerEl.setAttribute('material', 'opacity', parseFloat(opacity));
                        }
                    });
                    if (fireBreathTimer) {
                        clearTimeout(fireBreathTimer);
                        fireBreathTimer = null;
                    }
                }

                function breatheFire() {
                    if (!fireBreathEl) return;
                    resetFireBreath();
                    fireBreathEl.setAttribute('visible', true);
                    fireBreathEl.emit('fireBreath');
                    fireBreathTimer = setTimeout(resetFireBreath, 2050);
                }

                // Model Switching Logic
                var oldDragonEl = document.querySelector('#bowser-model');
                var mantisEl = document.querySelector('#mantis-model');
                var flashEl = document.querySelector('#transform-flash');
                var modelSwitched = false; // ensures the dragon -> mantis transformation only ever happens once

                function playTransformFlash() {
                    if (!flashEl) return;
                    flashEl.setAttribute('visible', true);
                    flashEl.emit('transformFlash');
                    setTimeout(function () {
                        flashEl.setAttribute('visible', false);
                    }, 900);
                }

                function transformDragonToMantis() {
                    if (modelSwitched || !oldDragonEl || !mantisEl) return;
                    modelSwitched = true;

                    // Magical glowing flash / particle burst at the moment of transformation.
                    playTransformFlash();

                    // Old dragon: play its scale-down + fade-out transition, then hide it for good.
                    oldDragonEl.emit('dragonSwitchOut');
                    setTimeout(function () {
                        oldDragonEl.setAttribute('visible', false);
                        oldDragonEl.removeEventListener('click', breatheFire);
                        oldDragonEl.removeEventListener('click', transformDragonToMantis);
                    }, 950);

                    // Mantis: make it visible/raycastable and play its scale-up + fade-in transition.
                    // Position, rotation and target scale exactly match the dragon's own resting transform.
                    mantisEl.setAttribute('visible', true);
                    mantisEl.emit('dragonSwitchIn');

                    // Keep "click events" working on the mantis - fire breathing is preserved and now
                    // plays from the mantis instead of the dragon.
                    mantisEl.addEventListener('click', breatheFire);
                }

                if (oldDragonEl) {
                    // Existing fire-breath tap interaction is preserved...
                    oldDragonEl.addEventListener('click', breatheFire);
                    // ...and the new one-time dragon -> mantis transformation is added alongside it.
                    oldDragonEl.addEventListener('click', transformDragonToMantis);
                }

                function getPanelEl(name) {
                    return document.querySelector('#panel-' + name);
                }

                function showPanel(name) {
                    var panelEl = getPanelEl(name);
                    if (!panelEl) return;
                    panelEl.setAttribute('visible', true);
                    // restart animation in case it was mid-fade
                    panelEl.emit('panelShow');
                }

                function hidePanel(name) {
                    var panelEl = getPanelEl(name);
                    if (!panelEl) return;
                    panelEl.emit('panelHide');
                }

                function onPanelFadeOutComplete(evt) {
                    // hide entity fully once fade-out animation finishes to stop raycasting/rendering it
                    if (evt.detail && evt.detail.name === 'fadeout') {
                        evt.target.setAttribute('visible', false);
                    }
                }

                ['panel-about', 'panel-gallery', 'panel-contact'].forEach(function (id) {
                    var el = document.querySelector('#' + id);
                    if (el) {
                        el.addEventListener('animationcomplete__fadeout', onPanelFadeOutComplete);
                    }
                });

                function togglePanel(name) {
                    if (activePanel === name) {
                        // clicking the same button again hides its panel
                        hidePanel(activePanel);
                        activePanel = null;
                        return;
                    }
                    if (activePanel) {
                        hidePanel(activePanel);
                    }
                    showPanel(name);
                    activePanel = name;
                }

                function bindButton(id) {
                    var btnEl = document.querySelector('#' + id);
                    if (!btnEl) return;
                    btnEl.addEventListener('click', function () {
                        var panelName = btnEl.getAttribute('data-panel');
                        togglePanel(panelName);
                    });
                }

                bindButton('btn-about');
                bindButton('btn-gallery');
                bindButton('btn-contact');

                function showButtons() {
                    if (!buttonsContainer) return;
                    buttonsContainer.querySelectorAll('.ui-button').forEach(function (btn) {
                        btn.emit('showUI');
                    });
                }

                function hideButtons() {
                    if (!buttonsContainer) return;
                    buttonsContainer.querySelectorAll('.ui-button').forEach(function (btn) {
                        btn.emit('hideUI');
                    });
                }

                function closeAllPanels() {
                    if (activePanel) {
                        hidePanel(activePanel);
                        activePanel = null;
                    }
                }

                if (markerEl) {
                    markerEl.addEventListener('markerFound', function () {
                        showButtons();
                    });
                    markerEl.addEventListener('markerLost', function () {
                        hideButtons();
                        closeAllPanels();
                        resetFireBreath();
                    });
                }
            })();
        </script>
        <!-- End Added Interactive UI -->
    </body>
</html>
